<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=index.html?edit=1"><title>Edit Priyankaa Nigam Portfolio</title></head><body><p><a href="index.html?edit=1">Open editor</a></p>
<div class="video-modal" id="videoModal" aria-hidden="true"><div class="video-modal-inner"><button class="video-close" id="videoClose" aria-label="Close video">×</button><video id="modalVideo" controls playsinline></video></div></div>
<script>
(()=>{const modal=document.getElementById('videoModal'), player=document.getElementById('modalVideo'), close=document.getElementById('videoClose');if(!modal||!player)return;function shut(){player.pause();player.removeAttribute('src');player.load();modal.classList.remove('open');modal.setAttribute('aria-hidden','true');}document.querySelectorAll('.media-item').forEach(item=>item.addEventListener('click',e=>{if(e.target.closest('button'))return;const v=item.querySelector('video');if(!v||!v.currentSrc&&!v.src)return;player.src=v.currentSrc||v.src;player.poster=v.poster||'';modal.classList.add('open');modal.setAttribute('aria-hidden','false');player.play().catch(()=>{});}));close&&close.addEventListener('click',shut);modal.addEventListener('click',e=>{if(e.target===modal)shut();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))shut();});})();
</script>
</body></html>
